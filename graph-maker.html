<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="firebase-config.js"></script>
<script>if(window.CELLGRAPH_FIREBASE===undefined) window.CELLGRAPH_FIREBASE=null;</script>
<script src="login.js"></script>
</head><body>
<title>셀 데이터 그래프 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-instrument workbench — slim control rail on the left, Excel-faithful figure sheets on the right. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1b2328; --ink2:#4d5a63; --muted:#7c8a93;
  --line:#d5dce1; --line2:#e6ebee; --accent:#0f5c78; --accent-ink:#ffffff; --accent-soft:#e1eef3;
  --warn:#9a5b00; --sheet:#f7f9fa;
  --ui:'IBM Plex Sans KR', 'Malgun Gothic','Apple SD Gothic Neo', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13181b; --panel:#1b2226; --ink:#e4eaed; --ink2:#b3c0c7; --muted:#8696a0;
  --line:#2f3a40; --line2:#263035; --accent:#5fb3d3; --accent-ink:#0b1a20; --accent-soft:#1d3440;
  --warn:#e0a248; --sheet:#171d20; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13181b; --panel:#1b2226; --ink:#e4eaed; --ink2:#b3c0c7; --muted:#8696a0;
  --line:#2f3a40; --line2:#263035; --accent:#5fb3d3; --accent-ink:#0b1a20; --accent-soft:#1d3440;
  --warn:#e0a248; --sheet:#171d20; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
.homebtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap}
.homebtn:hover{color:var(--accent);border-color:var(--accent)}
.homebtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.homebtn svg{width:15px;height:15px;flex:none}
.appnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.homebtn.swap{color:var(--accent);border-color:var(--accent)}
.homerow{display:flex;justify-content:flex-end;width:100%;margin-bottom:-4px}

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.wrap{padding-inline:16px;padding-block:14px 40px;max-width:1800px;margin:0 auto;display:grid;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mascot{width:76px;height:76px;flex:none;display:block;margin-block:-8px}
@media (max-width:560px){.brand .mascot{width:60px;height:60px;margin-block:-4px}}
.brand .bt{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{font-size:12px;padding:4px 8px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.filebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.filebar .src{font-size:12.5px;color:var(--ink2);margin-right:4px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:inline-flex;gap:6px;align-items:center;background:var(--sheet)}
.chip b{font-weight:600}
.chip .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.chip.none{color:var(--muted)}
.drop{outline:2px dashed var(--accent);outline-offset:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;font-size:14px;background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;color:var(--ink2);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
aside.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:900px){aside.rail{position:static;max-height:none}}
.fld{display:grid;gap:5px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
textarea{resize:vertical;min-height:52px;font-size:12px}
input[type=number]{font-family:var(--mono);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;font:inherit;font-size:12.5px;border:none;background:var(--sheet);color:var(--ink2);padding:6px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.groups{display:grid;gap:4px;max-height:420px;overflow:auto;padding-right:2px}
.grp{border:1px solid var(--line2);border-radius:5px;background:var(--sheet)}
.grp>.gh{display:flex;align-items:center;gap:6px;padding:4px 6px}
.grp>.gh .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp>.gh .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grp .tg{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px}
input[type=color]{width:24px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;flex:none}
.cells{display:grid;gap:3px;padding:2px 6px 6px 28px}
.cells .c{display:flex;align-items:center;gap:6px}
.cells .sw{width:10px;height:10px;border-radius:50%;border:2px solid;flex:none;background:#fff}
.cells input[type=text]{font-size:12px;padding:2px 5px}
details.ax{border:1px solid var(--line2);border-radius:5px;background:var(--sheet)}
details.ax>summary{cursor:pointer;padding:6px 8px;font-size:12.5px;font-weight:600}
details.ax .in{padding:4px 8px 8px;display:grid;gap:6px}
.g3{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.g3 span{font-family:var(--mono)}
.hint{font-size:11.5px;color:var(--muted)}
.sheets{display:grid;gap:18px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar .meta{font-size:12.5px;color:var(--ink2)}
.banner{font-size:12.5px;background:var(--accent-soft);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:8px 10px}
section.set{display:grid;gap:8px;min-width:0}
section.set>h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
section.set>h3 .dot{width:12px;height:12px;border-radius:3px;flex:none}
section.set>h3 small{font-weight:400;color:var(--muted);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px}
.charts.vp{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
figure.card{margin:0;background:#fff;border:1px solid var(--line);border-radius:4px;position:relative;min-width:0}
figure.card svg{display:block;width:100%;height:auto}
figure.card .acts{position:absolute;right:6px;top:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
figure.card:hover .acts,figure.card:focus-within .acts{opacity:1}
@media (hover:none){figure.card .acts{opacity:1}}
figure.card .acts button{font:inherit;font-size:11px;border:1px solid #c9d1d6;background:#fff;color:#22313a;border-radius:4px;padding:2px 7px;cursor:pointer}
figure.card .acts button:hover{border-color:#0f5c78;color:#0f5c78}
.tip{position:absolute;pointer-events:none;background:#1b2328;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:4px;white-space:nowrap;z-index:5;font-family:var(--ui);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tip b{font-weight:600}
.tip .v{font-family:var(--mono)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--panel)}
.modal{position:fixed;inset:0;background:rgba(10,16,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--panel);color:var(--ink);border-radius:8px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:16px;display:grid;gap:10px}
.modal h2{margin:0;font-size:16px}
.modal textarea{min-height:220px;font-family:var(--mono);font-size:11.5px;white-space:pre}
.modal img{max-width:100%;border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.busy{font-size:12.5px;color:var(--warn)}
button.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 3px;border-radius:3px;flex:none}
button.x:hover{color:#c62828;background:var(--line2)}
.fgrp{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line2)}
.toast .tact{margin-left:12px;font:inherit;font-weight:600;background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:1px 8px;cursor:pointer}
.loadpair{display:flex;gap:8px;flex-wrap:wrap}
.btn2{padding:6px 12px 6px 10px;gap:9px;text-align:left;line-height:1.2}
.btn2 b{display:block;font-weight:600;font-size:13px}
.btn2 small{display:block;font-size:11px;opacity:.82;font-weight:400}
.btn2 .ic{font-size:17px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.btn2.primary .ic{background:rgba(255,255,255,.18)}
.btn2.add{border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn2.add .ic{background:var(--accent);color:var(--accent-ink)}
.btn2.add:hover{border-style:solid}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.cloud .cd{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.cloud.saved .cd{background:#2e7d32}
.cloud.saving .cd,.cloud.loading .cd{background:var(--accent);animation:pulse 1s infinite alternate}
.cloud.full .cd,.cloud.error .cd{background:#c62828}
@keyframes pulse{to{opacity:.3}}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.allbtns{display:flex;gap:4px}
.allbtns .btn{padding:2px 7px;font-size:11px}
.txtgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px 6px;align-items:center;font-size:12px}
.txtgrid>span:nth-child(-n+4){font-size:10.5px;color:var(--muted)}
.txtgrid input{padding:3px 5px;font-size:12px}
.acct{display:flex;align-items:center;gap:8px}
.acct .who{font-size:12.5px;color:var(--ink2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .btn.login{border-color:var(--accent);color:var(--accent);font-weight:600}
.loginbox{display:grid;gap:10px;min-width:min(340px,80vw)}
.loginbox input{width:100%}
.loginbox .or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.loginbox .or::before,.loginbox .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.loginbox .err{color:#c62828;font-size:12.5px;min-height:1em}
.loginbox .links{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.loginbox .links a{color:var(--accent);cursor:pointer}
footer.copy{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .mascot{filter:invert(1)} }
:root[data-theme="dark"] .brand .mascot{filter:invert(1)}
</style>

// ---------- CYCLE sheet: Chg | Dis | Effi | Ret blocks ----------

function pct(arr,p){if(!arr.length)return NaN;const a=arr.slice().sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.floor(p*(a.length-1))))];}
function cycleX(maxX){ if(!(maxX>0)) maxX=10; if(maxX<=50) return {min:0,max:Math.max(10,Math.ceil(maxX/10)*10),step:5}; if(maxX<=100) return {min:0,max:Math.ceil((maxX+1)/10)*10,step:10}; if(maxX<=200) return {min:0,max:Math.ceil((maxX+1)/20)*20,step:20}; return {min:0,max:Math.ceil((maxX+1)/50)*50,step:50}; }
function autoAxes(kind,series){
  const xs=[],ys=[];
  for(const s of series) for(const seg of s.segs) for(const p of seg){ if(isNum(p[0])&&isNum(p[1])){xs.push(p[0]);ys.push(p[1]);} }
  const xmax=xs.length?Math.max(...xs):10, ymax=ys.length?Math.max(...ys):1, ymin=ys.length?Math.min(...ys):0;
  if(kind==='dis'){ const x=cycleX(xmax); const y=(ymax>100&&ymax<=220&&ymin>=0)?{min:0,max:220,step:20}:niceAxis(0,ymax*1.1,10); return {x,y}; }
  if(kind==='eff'){ const x=cycleX(xmax); const p5=pct(ys,.05), mx=pct(ys,.995); let y;
    if(p5>=97&&mx<=102) y={min:97,max:102,step:.5}; else if(p5>=95&&mx<=102) y={min:95,max:102,step:1}; else y=niceAxis(Math.max(0,p5-1),Math.min(110,Math.max(mx,100)+.5),8); return {x,y}; }
  if(kind==='ret'){ const x=cycleX(xmax); let y; const lo=pct(ys,.002);
    if(lo>=75) y={min:75,max:110,step:5}; else if(lo>=70) y={min:70,max:110,step:5}; else y={min:Math.max(0,Math.floor(lo/10)*10-(lo%10<3?10:0)),max:110,step:10}; return {x,y}; }
  // voltage profile
  const x=(xmax>100&&xmax<=240)?{min:0,max:240,step:20}:niceAxis(0,xmax*1.05,10);
  const y=(ymin>=2-1e-9&&ymax<=4.7+1e-9)?{min:2,max:4.7,step:.5}:niceAxis(Math.floor(ymin*10)/10,ymax,6);
  return {x,y};
}

/* ---------------- the chart renderer (SVG, Excel-styled) ---------------- */
let UID=0;
function markerPath(kind,x,y,sz){
  if(kind==='square'){const s=sz*.5;return `M${(x-s).toFixed(1)},${(y-s).toFixed(1)}h${(2*s).toFixed(1)}v${(2*s).toFixed(1)}h${(-2*s).toFixed(1)}z`;}
  if(kind==='diamond'){const d=sz*.68;return `M${x.toFixed(1)},${(y-d).toFixed(1)}l${d.toFixed(1)},${d.toFixed(1)}l${(-d).toFixed(1)},${d.toFixed(1)}l${(-d).toFixed(1)},${(-d).toFixed(1)}z`;}
  const r=sz*.5;return `M${(x-r).toFixed(1)},${y.toFixed(1)}a${r},${r} 0 1,0 ${(2*r).toFixed(1)},0a${r},${r} 0 1,0 ${(-2*r).toFixed(1)},0`;
}
function renderChart(spec){
  const L=LOOK[spec.look], k=spec.fontScale||1, W=L.W, H=L.H, id='c'+(++UID);
  const P={x:W*L.plot[0],y:H*L.plot[1],w:W*L.plot[2],h:H*L.plot[3]};
  const ax=spec.axes, X=ax.x, Y=ax.y;
  const sx=v=>P.x+(v-X.min)/(X.max-X.min)*P.w, sy=v=>P.y+P.h-(v-Y.min)/(Y.max-Y.min)*P.h;
  const px=n=>n*PT*k;
  const o=[];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${esc(FONT)}">`);
  o.push(`<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d9d9"/></linearGradient>`+
    `<clipPath id="${id}k"><rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}"/></clipPath>`+
    `<filter id="${id}s" x="-5%" y="-10%" width="115%" height="130%"><feDropShadow dx="2" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".4"/></filter></defs>`);
  o.push(`<rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" fill="#ffffff" stroke="#000000" stroke-width="1"/>`);
  // title
  const TX=spec.txt||{}; const fz=(key,def)=>(TX[key]&&+TX[key].sz>0)?+TX[key].sz*PT:def; const ox=key=>+(TX[key]&&TX[key].dx)||0, oy=key=>+(TX[key]&&TX[key].dy)||0;
  const tp=fz('title',px(L.title)); const titleY=H*.018+px(L.title)*.85;
  if(spec.title) o.push(`<text x="${(W/2+ox('title')).toFixed(1)}" y="${(H*.018+tp*.85+oy('title')).toFixed(1)}" text-anchor="middle" font-size="${tp.toFixed(1)}" ${L.titleB?'font-weight="bold"':''} fill="#000000">${esc(spec.title)}</text>`);
  // condition note (text box under the title, like the workbook)
  let noteBox=null, legendBox=null;
  if(spec.note){ const np=fz('note',px(L.note)); const nx=P.x-W*.01+ox('note'); const lines=spec.note.split('\n').filter(s=>s.trim()!=='').slice(0,3); let ny=titleY+np*1.2+oy('note'); noteBox={x1:(nx-W*.002)/W,y1:(ny-np*1.05)/H,x2:.985,y2:Math.min(P.y/H,(ny+np*1.08*(lines.length-1)+np*.4)/H),lines};
    for(const ln of lines){ o.push(`<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="${np.toFixed(1)}" font-weight="bold" fill="#000000" xml:space="preserve">${esc(ln)}</text>`); ny+=np*1.08; } }
  // plot area
  o.push(`<rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}" fill="url(#${id}g)"/>`);
  const tk=fz('tick',px(L.tick)), dY=decimals(Y.step), dX=decimals(X.step);
  const yt=[],xt=[]; for(let v=Y.min, i=0; v<=Y.max+Y.step*1e-6 && i<200; i++, v=Y.min+i*Y.step) yt.push(+v.toFixed(10));
  for(let v=X.min, i=0; v<=X.max+X.step*1e-6 && i<400; i++, v=X.min+i*X.step) xt.push(+v.toFixed(10));
  // gridlines: horizontal, grey dashed (sysDash)
  for(const v of yt){ if(v<=Y.min+1e-9||v>=Y.max-1e-9) continue; const y=sy(v).toFixed(1); o.push(`<line x1="${P.x}" x2="${P.x+P.w}" y1="${y}" y2="${y}" stroke="#bfbfbf" stroke-width="0.9" stroke-dasharray="3 2"/>`); }
  // ticks + labels
  const lwx=Math.max(...xt.map(v=>tw(v.toFixed(dX),tk,true)))+6; const pxStep=P.w/Math.max(1,(X.max-X.min)/X.step); const kx=Math.max(1,Math.ceil(lwx/pxStep)); const kyy=Math.max(1,Math.ceil(tk*1.05/(P.h/Math.max(1,(Y.max-Y.min)/Y.step))));
    o.push(`<g fill="#000000" font-size="${tk.toFixed(1)}" font-weight="bold">`);
  for(const v of yt){ const y=sy(v); const yi=Math.round((v-Y.min)/Y.step); o.push(`<line x1="${P.x-5}" x2="${P.x}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#000" stroke-width="0.9"/><text x="${(P.x-8+ox('tick')).toFixed(1)}" y="${(y+tk*.36).toFixed(1)}" text-anchor="end">${yi%kyy?'':v.toFixed(dY)}</text>`); }
  for(const v of xt){ const x=sx(v); const xi=Math.round((v-X.min)/X.step); o.push(`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${P.y+P.h}" y2="${P.y+P.h+5}" stroke="#000" stroke-width="0.9"/><text x="${x.toFixed(1)}" y="${(P.y+P.h+6+tk*.95+oy('tick')).toFixed(1)}" text-anchor="middle">${xi%kx?'':v.toFixed(dX)}</text>`); }
  o.push('</g>');
  // axis titles
  const xp=fz('xt',px(L.xt)), yp=fz('yt',px(L.yt));
  if(spec.xTitle) o.push(`<text x="${(P.x+P.w/2+ox('xt')).toFixed(1)}" y="${(Math.min(H-6,H*.912+xp*.9)+oy('xt')).toFixed(1)}" text-anchor="middle" font-size="${xp.toFixed(1)}" ${L.xtB?'font-weight="bold"':''} fill="#000000">${esc(spec.xTitle)}</text>`);
  if(spec.yTitle){ const cx=W*.012+yp*.75+ox('yt'), cy=P.y+P.h/2+oy('yt'); o.push(`<text transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="${yp.toFixed(1)}" ${L.ytB?'font-weight="bold"':''} fill="#000000">${esc(spec.yTitle)}</text>`); }
  // series
  const hit=[];
  o.push(`<g clip-path="url(#${id}k)">`);
  const ms=7*PT*(spec.markerScale||1);
  for(const s of spec.series){
    const hs={name:s.name,color:s.color,pts:[]};
    if(s.line!==false){ let d=''; for(const seg of s.segs){ let first=true, lx=null, ly=null;
        for(const p of seg){ if(!isNum(p[0])||!isNum(p[1])){first=true;continue;} const x=sx(p[0]), y=sy(p[1]);
          if(!first && Math.abs(x-lx)<.6 && Math.abs(y-ly)<.6) continue; d+=(first?'M':'L')+x.toFixed(1)+','+y.toFixed(1); first=false; lx=x; ly=y; } }
      if(d) o.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.lineW||2}" stroke-linejoin="round" stroke-linecap="round"/>`); }
    if(s.marker && s.marker!=='none'){ let d=''; const every=Math.max(1,s.every||1); let i=0;
      for(const seg of s.segs) for(const p of seg){ if(!isNum(p[0])||!isNum(p[1])) continue; if((i++)%every) continue; const x=sx(p[0]),y=sy(p[1]); if(x<P.x-10||x>P.x+P.w+10||y<P.y-10||y>P.y+P.h+10) continue; d+=markerPath(s.marker,x,y,ms); }
      if(d) o.push(`<path d="${d}" fill="#ffffff" stroke="${s.color}" stroke-width="${(2*PT*.75).toFixed(2)}"/>`); }
    // hover targets (sub-sampled)
    let cnt=0; for(const seg of s.segs) cnt+=seg.length; const st=Math.max(1,Math.floor(cnt/600)); let j=0;
    for(const seg of s.segs) for(const p of seg){ if((j++)%st) continue; if(!isNum(p[0])||!isNum(p[1])) continue; const x=sx(p[0]),y=sy(p[1]); if(x<P.x||x>P.x+P.w||y<P.y||y>P.y+P.h) continue; hs.pts.push([x,y,p[0],p[1]]); }
    hit.push(hs);
  }
  o.push('</g>');
  o.push(`<rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}" fill="none" stroke="#000000" stroke-width="1"/>`);
  // legend
  const lg=spec.legend||'top';
  if(lg!=='none' && spec.series.length){
    const horiz=(lg==='top'||lg==='bottom'), samp=34, gap=6, pad=8, n=spec.series.length;
    const Wmax=horiz?P.w-8:P.w-20, Hmax=P.h-8;
    let best=null;
    for(const f of [1,.92,.85,.78,.7,.62,.55]){
      const lp=fz('leg',px(L.leg))*f, rh=lp*1.45, ws=spec.series.map(s=>samp+gap+tw(s.name,lp,false)+12);
      const fit=cols=>{ const cw=[]; for(let i=0;i<n;i++){ const c=i%cols; cw[c]=Math.max(cw[c]||0,ws[i]); } const tot=cw.reduce((a,b)=>a+b,0)+2*pad; const rows=Math.ceil(n/cols); return {cols,cw,tot,rows,h:rows*rh+pad}; };
      let L1=null;
      if(horiz){ for(let c=n;c>=1;c--){ const t=fit(c); if(t.tot<=Wmax||c===1){ L1=t; break; } } }
      else { for(let c=1;c<=n;c++){ const t=fit(c); if((t.h<=Hmax*.9&&t.tot<=Wmax)||c===n){ L1=t; break; } if(t.tot>Wmax){ L1=fit(Math.max(1,c-1)); break; } } }
      L1.lp=lp; L1.rh=rh; best=L1;
      if(L1.h<=Hmax*(horiz?.55:.9) && L1.tot<=Wmax+1) break;
    }
    const {cols,cw,rows,lp,rh}=best; const bh=Math.min(best.h,Hmax);
    let bw,bx,by;
    if(horiz){ bw=P.w-8; bx=P.x+4; } else { bw=Math.min(Wmax,best.tot); bx=(lg==='bottom-left'||lg==='top-left')?P.x+10:P.x+P.w-bw-10; }
    by=(lg==='top'||lg==='top-left'||lg==='top-right')? P.y+4 : P.y+P.h-bh-(lg==='bottom'?4:10);
    bx+=ox('leg'); by+=oy('leg');
    legendBox={x:bx/W,y:by/H,w:bw/W,h:bh/H,sz:lp/PT};
    o.push(`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#f2f2f2" stroke="#000000" stroke-width="0.9" filter="url(#${id}s)"/>`);
    const extra=Math.max(0,(bw-2*pad-cw.reduce((a,b)=>a+b,0))/cols); const cx=[]; let acc=bx+pad; for(let c=0;c<cols;c++){ cx[c]=acc; acc+=cw[c]+extra; }
    const msL=Math.min(ms,lp*.75);
    spec.series.forEach((s,i)=>{ const c=i%cols, r=Math.floor(i/cols); const x0=cx[c], cy=by+pad/2+r*rh+rh/2; if(cy>by+bh) return;
      if(s.line!==false) o.push(`<line x1="${x0.toFixed(1)}" x2="${(x0+samp).toFixed(1)}" y1="${cy.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${s.color}" stroke-width="${s.lineW||2}"/>`);
      if(s.marker&&s.marker!=='none') o.push(`<path d="${markerPath(s.marker,x0+samp/2,cy,msL)}" fill="#ffffff" stroke="${s.color}" stroke-width="${(2*PT*.75).toFixed(2)}"/>`);
      o.push(`<text x="${(x0+samp+gap).toFixed(1)}" y="${(cy+lp*.36).toFixed(1)}" font-size="${lp.toFixed(1)}" fill="#000000">${esc(s.name)}</text>`); });
  }

}

function groupColor(key,order){ if(!S.colors[key]){ const used=new Set(Object.values(S.colors)); let c=PALETTE.find(p=>!used.has(p)); if(!c) c=PALETTE[order%PALETTE.length]; S.colors[key]=c; } return S.colors[key]; }

/* ---------------- loading ---------------- */
function normalize(src){
  if(src.kind==='cycle'){ src.cells.forEach(c=>{ c.pts=c.pts.map(p=>{ p=p.slice(); if(!(p[2]>0)){ p[2]=null; p[3]=null; p[4]=null; } if(!(p[1]>0)){ p[1]=null; p[3]=null; } return p; }); }); src.cells=src.cells.filter(c=>c.pts&&c.pts.some(p=>p[2]!=null)); }
  if(src.kind==='profile') src.curves=src.curves.filter(c=>c.segs&&c.segs.length);
  return src;
}
function loadSample(){
  let d={sources:[]}; try{ d=JSON.parse($('#sampleData').textContent||'{}'); }catch(e){}
  if(!d.sources||!d.sources.length){ S.sources=[]; S.isSample=false; syncFileName(); afterLoad(); return; }
  S.sources=d.sources.map(x=>Object.assign(normalize(x),{file:'Full cell data (예시)'})); S.fileName='Full cell data (예시)'; S.isSample=true; afterLoad();
}
function gridFromTSV(text){ return text.replace(/\r/g,'').split('\n').map(line=>line.split('\t').map(v=>{ const t=v.trim(); if(t==='') return null; const n=Number(t.replace(/,/g,'')); return (/^[-+]?[\d,]*\.?\d+(e[-+]?\d+)?$/i.test(t)&&isFinite(n))?n:t; })); }
function busy(msg){ const fb=$('#filebar'); fb.innerHTML=`<span class="busy">${esc(msg)}</span>`; }
async function loadFiles(files,mode){
  if(!files||!files.length) return;
  if(typeof XLSX==='undefined'){ toast('엑셀 읽기 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.'); return; }
  busy('파일을 읽는 중… (큰 파일은 몇 초 걸립니다)');
  await new Promise(r=>setTimeout(r,30));
  const out=[]; const names=[]; const cexList=[];
  // cycler raw data (.cex · .wrd · TOYO folder/zip) goes through the same reader as 셀 데이터 변환기
  const isSheet=f=>/\.(xlsx|xls|xlsm|xlsb|csv|ods)$/i.test(f.name);
  const rawIn=files.filter(f=>!isSheet(f)); files=files.filter(isSheet);
  if(rawIn.length){
    try{ const picked=await Raw.readPicked(rawIn); const R=Raw.loadRaw(picked,{currentRangeMa:+S.cex.irange||10});
      R.errors.forEach(x=>{ console.error(x.error); toast(`"${x.name}"을(를) 읽지 못했습니다. ${x.error&&x.error.message||''}`); });
      if(!R.tests.length&&!R.errors.length) toast('읽을 수 있는 파일이 없습니다. 엑셀, .cex, .wrd 파일이나 TOYO 폴더(.zip)를 넣어 주세요.');
      R.tests.forEach(t=>{ cexList.push({name:t.file,label:t.name,P:t.P}); names.push(t.file); });
    }catch(e){ console.error(e); toast('원본 파일을 읽지 못했습니다. '+(e&&e.message||'')); }
  }
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,Object.assign({type:'array'},READ_OPTS));
      names.push(f.name);
      for(const sn of wb.SheetNames){
        await new Promise(r=>setTimeout(r,0));
        let d=null; try{ d=BatParse.detect(XLSX,wb.Sheets[sn]); }catch(e){ console.warn(sn,e); }
        if(d){ d.name=sn; d.file=f.name; out.push(normalize(d)); }
      }
    }catch(e){ console.error(e); toast(`"${f.name}"을(를) 읽지 못했습니다. 엑셀(.xlsx) 또는 충방전기 원본(.cex · .wrd · TOYO) 파일인지 확인하세요.`); }
  }
  if(cexList.length){ renderFilebar(); const opt=await askCex(cexList); if(!opt){ if(!out.length){ renderFilebar(); return; } } else cexList.forEach((c,i)=>out.push(...cexToSources(c,opt,i))); if(opt) applyCexDefaults(opt,cexList); }
  if(!out.length){ toast('그래프로 만들 수 있는 시트를 찾지 못했습니다. 아래 "엑셀에서 붙여넣기" 도움말의 형식을 확인하세요.'); renderFilebar(); return; }
  if(mode==='add' && !S.isSample){ snapshot(); const nf=new Set(names); const kept=S.sources.filter(x=>!nf.has(x.file)); const replaced=S.sources.length-kept.length; S.sources=kept.concat(out); if(replaced) toast('같은 이름의 파일이 있어 새 파일로 바꿨습니다.'); }
  else { S.sources=out; S.cyc.src=0; S.vp.src=0; }
  S.isSample=false; syncFileName(); afterLoad();
}
function addPasted(text){

  let n=1; while(S.sources.some(s=>s.name==='붙여넣기 '+n)) n++; d.name='붙여넣기 '+n; d.file='붙여넣은 데이터';
  if(S.isSample){ S.sources=[]; S.isSample=false; }

async function cloudWrite(){
  if(!CLOUD.ready||!localSavedAt) return;

  const json=JSON.stringify({v:1,sources:S.sources,isSample:S.isSample,cs:S.cyc.src,vs:S.vp.src,tab:S.tab,settings:settingsObj()});
  const hash=fnv(json); if(hash===CLOUD.hash){ setCloud('saved'); return; }
  CLOUD.busy=true; setCloud('saving');
  try{
    const zip=new JSZip(); zip.file('d.json',json); const b64=await zip.generateAsync({type:'base64',compression:'DEFLATE',compressionOptions:{level:6}});
    const gen=Date.now().toString(36)+Math.random().toString(36).slice(2,6); const n=Math.max(1,Math.ceil(b64.length/CHUNK));
    for(let i=0;i<n;i++) await CLOUD.db.doc(`${CLOUD.base}/c_${gen}_${i}`).set({g:gen,i,s:b64.slice(i*CHUNK,(i+1)*CHUNK)});
    const at=localSavedAt; await CLOUD.db.doc(CLOUD.base+'/state').set({v:1,gen,n,hash,savedAt:at,bytes:b64.length});
    CLOUD.hash=hash; setCloud('saved',at);

    try{ const old=await CLOUD.db.collection(CLOUD.base).where('g','!=',gen).get(); for(const d of old.docs){ if(d.id!=='state'&&d.id.startsWith('c_')) await CLOUD.db.doc(CLOUD.base+'/'+d.id).delete(); } }catch(e){ console.warn('cleanup',e); }
  }catch(e){ console.warn('cloud save',e);
    if(e&&e.code==='quota_exceeded'){ setCloud('full'); if(!CLOUD.warned){ CLOUD.warned=true; toast('계정 저장 공간이 부족해 이 브라우저에만 저장했습니다. 쓰지 않는 파일을 지우면 다시 계정에 저장됩니다.'); } }
    else if(e&&(e.code==='revoked'||e.code==='not_granted'||e.code==='invalid_argument')){ CLOUD.ready=false; setCloud('local'); }
    else { setCloud('error'); setTimeout(()=>cloudSave(),15000); }
  }finally{ CLOUD.busy=false; if(CLOUD.again){ CLOUD.again=false; cloudSave(); } }
}

function cexToSources(c,opt,i){

  const pts=sum.filter((s,j)=>j>=nf).map((s,j)=>{ const ch=unit(s.chg), di=unit(s.dis); return [j+1,ch,di,(s.chg>0&&s.dis!=null)?s.dis/s.chg*100:null,(base&&s.dis!=null)?s.dis/base*100:null]; });
  const cyc={kind:'cycle',name:'Cycle',file,cells:[{name:lot,exp:P.name||'',group:BatParse.groupKey(lot),pts}]};
  const curves=[];
  const byC=new Map(); for(const st of P.steps){ if(!st.recs.length||(st.kind!=='chg'&&st.kind!=='dis')) continue; const e=byC.get(st.cycle)||{chg:[],dis:[]}; e[st.kind].push(...st.recs); byC.set(st.cycle,e); }
  [...byC.keys()].sort((a,b)=>a-b).forEach(cn=>{ const e=byC.get(cn); const label=cn<=nf?`Formation_${cn}`:`${rate}C_${ordinal(cn-nf)}`;
    const seg=a=>a.map(r=>[+(r[3]*k).toFixed(5),+r[1].toFixed(5)]); const segs=[]; if(e.chg.length) segs.push(seg(e.chg)); if(e.dis.length) segs.push(seg(e.dis));

    out.push(Object.assign({},c,{cell,label:canon[labelKey(c.label)],group:by==='sheet'?srcLabel(s):c.group,_src:s,_o:c})); }));
  return out;
}
function srcPicker(t,srcs){
  if(srcs.length<=1) return `<select id="${t==='cyc'?'cSrc':'vSrc'}">${srcs.map((s,i)=>`<option value="${i}" selected>${esc(srcLabel(s))}</option>`).join('')||'<option>없음</option>'}</select>`;

/* ---------------- data → chart specs ---------------- */
function groupsOf(items,keyFn){ const m=new Map(); for(const it of items){ const k=keyFn(it); if(!m.has(k)) m.set(k,[]); m.get(k).push(it); } return m; }
function cycleSets(){
  const vcells=virtCells(); if(!vcells.length) return [];
  const gm=groupsOf(vcells,c=>c.group); let order=0;
  const groups=[...gm.entries()].map(([key,cells])=>({key,cells,color:groupColor(key,order++),exp:cells[0].exp}));
  const on=c=>!S.cyc.off[c.name]; const gon=g=>!S.cyc.goff[g.key];
  const mk=(g,c,i,n)=>({cell:c,name:dispName(c.name),gcolor:g.color,color:shade(g.color,i,n,S.cyc.shadeMode)});
  if(S.cyc.view==='merge'){ const ser=[]; groups.filter(gon).forEach(g=>{ const cs=g.cells.filter(on); const n=g.cells.length; g.cells.forEach((c,i)=>{ if(on(c)) ser.push(mk(g,c,i,n)); }); });
    return ser.length?[{title:'선택한 셀 비교',sub:ser.length+'개 셀',color:null,series:ser}]:[]; }
  return groups.filter(gon).map(g=>{ const n=g.cells.length; const ser=[]; g.cells.forEach((c,i)=>{ if(on(c)) ser.push(mk(g,c,i,n)); }); return {title:g.key,sub:g.exp||'',color:g.color,series:ser}; }).filter(s=>s.series.length);
}
const CK=[['dis',2,'circle'],['eff',3,'square'],['ret',4,'diamond']];
function cycleCharts(set){
  return CK.map(([kind,col,marker])=>{
    const series=set.series.map(s=>({name:s.name,color:s.color,marker,line:S.cyc.line,every:S.cyc.every,cell:s.cell,gcolor:s.gcolor,col,segs:[s.cell.pts.map(p=>[p[0],p[col]])]}));
    return {kind,look:'cycle',series};
  });
}
function vpLabel(lbl){ const m=String(lbl).match(/^(\d+(?:\.\d+)?)\s*C+\s*_\s*(\d+)\s*(st|nd|rd|th)?/i); if(m) return `${(+m[1]).toFixed(1)} C ${m[2]}${m[3]||'th'} profile`; return String(lbl); }
function vpTitle(lbl){ return (S.axes.vp.title||'{label}').replace('{label}',vpLabel(lbl)); }
function vpModel(){
  const vcurves=virtCurves(); if(!vcurves.length) return null; const src=null;
  const gm=groupsOf(vcurves,c=>c.group); let order=0;
  const groups=[...gm.entries()].map(([key,curves])=>{ const cells=[]; const seen=new Set(); for(const c of curves){ if(!seen.has(c.cell)){seen.add(c.cell);cells.push(c.cell);} } return {key,curves,cells,color:groupColor(key,order++)}; });
  const labels=[]; const ls=new Set(); for(const c of vcurves){ if(!ls.has(c.label)){ls.add(c.label);labels.push(c.label);} }
  return {src,groups,labels};
}
function vpSeries(g,c,color){ const segs=S.vp.connect?[[].concat(...c.segs)]:c.segs; return {name:dispName(c.cell),color,marker:'none',line:true,lineW:S.vp.lineW,segs,curve:c,gcolor:g.color}; }
function vpSets(){
  const M=vpModel(); if(!M) return [];
  const on=n=>!S.vp.off[n], gon=g=>!S.vp.goff[g.key], lon=l=>!S.vp.laboff[l];
  if(S.vp.mode==='cell'){
    const sets=[]; const all=[]; let nCells=0;
    for(const g of M.groups.filter(gon)){ const charts=[]; const cellsOn=g.cells.filter(on);
      cellsOn.forEach((cell,ci)=>{ const cs=g.curves.filter(c=>c.cell===cell&&lon(c.label)); const n=cs.length; if(!n) return; nCells++;
        charts.push({kind:'vp',look:'vp',title:dispName(cell),series:cs.map((c,i)=>Object.assign(vpSeries(g,c,ramp(g.color,i,n)),{name:c.label}))});
        // the same curves for the combined chart: each cell keeps its own shade of the group colour, cycles go dark → light
        const base=shade(g.color,g.cells.indexOf(cell),g.cells.length,S.vp.shadeMode);
        cs.forEach((c,i)=>all.push(Object.assign(vpSeries(g,c,ramp(base,i,n)),{name:`${dispName(cell)} · ${c.label}`}))); });
      if(charts.length) sets.push({title:g.key,sub:'셀별 사이클 변화',color:g.color,charts}); }
    if(S.vp.cellAll&&nCells>1&&all.length) sets.unshift({title:'모든 셀 함께',sub:`${nCells}개 셀 · 사이클 변화 겹쳐 보기`,color:null,charts:[{kind:'vp',look:'vp',title:'Voltage Profile _ 모든 셀',series:all}]});
    return sets;
  }
  const build=(gs,title,color)=>{ const charts=[]; for(const lab of M.labels.filter(lon)){ const ser=[]; for(const g of gs){ const n=g.cells.length; g.cells.forEach((cell,i)=>{ if(!on(cell)) return; const c=g.curves.find(x=>x.cell===cell&&x.label===lab); if(c) ser.push(vpSeries(g,c,shade(g.color,i,n,S.vp.shadeMode))); }); }
      if(ser.length) charts.push({kind:'vp',look:'vp',title:vpTitle(lab),series:ser}); } return charts.length?{title,sub:charts.length+'개 사이클',color,charts}:null; };
  if(S.vp.view==='merge'){ const s=build(M.groups.filter(gon),'선택한 셀 비교',null); return s?[s]:[]; }
  return M.groups.filter(gon).map(g=>build([g],g.key,g.color)).filter(Boolean);
}
function axesFor(kind,series){ const a=S.axes[kind]; const au=autoAxes(kind,series); if(a.auto) return au;
  const f=(v,d)=>isNum(+v)&&v!==''&&v!=null?+v:d; const x={min:f(a.xmin,au.x.min),max:f(a.xmax,au.x.max),step:f(a.xstep,au.x.step)}, y={min:f(a.ymin,au.y.min),max:f(a.ymax,au.y.max),step:f(a.ystep,au.y.step)};
  if(!(x.max>x.min)) x.max=x.min+1; if(!(y.max>y.min)) y.max=y.min+1; if(!(x.step>0)) x.step=niceStep(x.max-x.min,8); if(!(y.step>0)) y.step=niceStep(y.max-y.min,8);
  if((x.max-x.min)/x.step>200) x.step=niceStep(x.max-x.min,10); if((y.max-y.min)/y.step>200) y.step=niceStep(y.max-y.min,10); return {x,y}; }

function tipAt(card,ev){
  const C=CHARTS[+card.dataset.i]; if(!C) return; const svg=card.querySelector('svg'); const rc=svg.getBoundingClientRect(); const k=C.W/rc.width;
  const x=(ev.clientX-rc.left)*k, y=(ev.clientY-rc.top)*k; let best=null, bd=(14*k)*(14*k);
  for(const s of C.hit) for(const p of s.pts){ const d=(p[0]-x)*(p[0]-x)+(p[1]-y)*(p[1]-y); if(d<bd){bd=d;best={s,p};} }
  if(!best){hideTip();return;}
  if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';card.appendChild(tipEl);} else if(tipEl.parentNode!==card){card.appendChild(tipEl);}
  const fx=v=>Math.abs(v)>=100?v.toFixed(1):Math.abs(v)>=10?v.toFixed(2):v.toFixed(3);
  tipEl.innerHTML=`<b style="color:#fff">${esc(best.s.name)}</b><br><span class="v">x ${fx(best.p[2])} · y ${fx(best.p[3])}</span>`;
  const cr=card.getBoundingClientRect(); let lx=best.p[0]/k+12, ly=best.p[1]/k-38; if(lx+tipEl.offsetWidth>cr.width-4) lx=best.p[0]/k-tipEl.offsetWidth-12; if(ly<4) ly=best.p[1]/k+14;
  tipEl.style.left=lx+'px'; tipEl.style.top=ly+'px';
}

function svgToPng(svg,W,H,scale){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png'); };
  img.onerror=e=>{URL.revokeObjectURL(url);rej(e);}; img.src=url; }); }
async function saveBlob(filename,blob,previewPng){

  else toast('이 화면에서는 파일 저장을 지원하지 않습니다. 복사 버튼을 사용하세요.');
}

/* ---------------- export: xlsx (data + native Excel charts) and csv ---------------- */
const EMU=9525;
function colL(n){ let s=''; n=n+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
const xe=s=>String(s==null?'':s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hexU=h=>String(h||'#000000').replace('#','').toUpperCase();
function pastel(hex){ const [H,S2,L]=hex2hsl(hex); return hsl2hex(H,Math.min(1,S2*.9),Math.max(L,.88)); }
function baseName(){ const n=(S.fileName||'cell data').split(',')[0].replace(/\.[^.]+$/,'').replace(/\s*\(예시\)\s*/,'').trim(); return safe(n||'cell data'); }

// Collect exactly what is on screen: the charts and the cells / curves they use.
function exportModel(){
  const isC=S.tab==='cyc';
  if(isC){
    const cells=[], seen=new Set();
    for(const C of CHARTS) for(const s of C.spec.series){ if(seen.has(s.cell.name)) continue; seen.add(s.cell.name); cells.push({cell:s.cell,name:dispName(s.cell.name),gcolor:s.gcolor,group:s.cell.group,exp:s.cell.exp||s.cell.group}); }
    const xs=[...new Set(cells.flatMap(c=>c.cell.pts.filter(p=>p[1]!=null||p[2]!=null).map(p=>p[0])))].sort((a,b)=>a-b);
    return {kind:'cycle',cells,xs,charts:CHARTS};
  }
  const curves=[], seen=new Set();
  for(const C of CHARTS) for(const s of C.spec.series){ const k=s.curve.cell+'\u0001'+s.curve.label; if(seen.has(k)) continue; seen.add(k); curves.push({curve:s.curve,key:k,name:dispName(s.curve.cell),label:s.curve.label,gcolor:s.gcolor,group:s.curve.group}); }
  return {kind:'profile',curves,charts:CHARTS,connect:S.vp.connect};
}
function curveRows(c,connect){ const out=[]; c.curve.segs.forEach((seg,i)=>{ if(i>0&&!connect) out.push(null); for(const p of seg) out.push(p); }); return out; }

/* ---- the data tables (shared by xlsx and csv) ---- */
function cycleTable(M){
  const H=['Chg. (mAh/g)','Dis. (mAh/g)','Effi. (%)','Ret. (%)'];
  const byX=M.cells.map(c=>{ const m=new Map(); for(const p of c.cell.pts) m.set(p[0],p); return m; });
  const rows=M.xs.map(x=>{ const r=[x]; byX.forEach(m=>{ const p=m.get(x); for(let k=1;k<=4;k++) r.push(p&&isNum(p[k])?p[k]:null); }); return r; });
  return {H,rows};
}

function buildCsv(M){
  const q=v=>{ if(v==null) return ''; if(typeof v==='number') return String(v); const s=String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[];
  if(M.kind==='cycle'){
    const {H,rows}=cycleTable(M);
    lines.push(['Cycle',...M.cells.flatMap(c=>H.map(h=>c.name+' '+h))].map(q).join(','));
    for(const r of rows) lines.push(r.map(q).join(','));
  } else {
    const cols=M.curves.map(c=>curveRows(c,M.connect));
    lines.push(M.curves.flatMap(c=>[c.name+' | '+c.label+' mAh/g',c.name+' | '+c.label+' Volt (V)']).map(q).join(','));
    const n=Math.max(0,...cols.map(c=>c.length));
    for(let i=0;i<n;i++){ const r=[]; cols.forEach(col=>{ const p=col[i]; r.push(p?p[0]:null,p?p[1]:null); }); lines.push(r.map(q).join(',')); }
  }
  return new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
}

function sheetXml(rows,o){
  o=o||{}; const out=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'];
  out.push(o.freeze?`<sheetViews><sheetView workbookViewId="0"${o.tabSelected?' tabSelected="1"':''}><pane xSplit="${o.freezeCol||0}" ySplit="${o.freeze}" topLeftCell="${colL(o.freezeCol||0)}${o.freeze+1}" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>`:`<sheetViews><sheetView workbookViewId="0"${o.tabSelected?' tabSelected="1"':''}${o.noGrid?' showGridLines="0"':''}/></sheetViews>`);
  out.push('<sheetFormatPr defaultRowHeight="15" customHeight="1"/>');
  if(o.cols&&o.cols.length) out.push('<cols>'+o.cols.map(([a,b,w])=>`<col min="${a}" max="${b}" width="${w}" customWidth="1"/>`).join('')+'</cols>');
  out.push('<sheetData>');
  const nRows=Math.max(rows.length,o.rowCount||0);
  for(let ri=0;ri<nRows;ri++){ const row=rows[ri]||[]; let cs='';
    for(let ci=0;ci<row.length;ci++){ const c=row[ci]; if(c==null) continue; let v=c,st=0; if(typeof c==='object'){ v=c.v; st=c.s||0; } const ref=colL(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v)) cs+=`<c r="${ref}"${st?` s="${st}"`:''}><v>${v}</v></c>`;
      else if(v==null||v===''){ if(st) cs+=`<c r="${ref}" s="${st}"/>`; }
      else cs+=`<c r="${ref}" t="inlineStr"${st?` s="${st}"`:''}><is><t xml:space="preserve">${xe(v)}</t></is></c>`; }
    const ht=o.heights&&o.heights[ri]; if(cs||ht) out.push(`<row r="${ri+1}"${ht?` ht="${ht}" customHeight="1"`:''}>${cs}</row>`); }
  out.push('</sheetData>');
  if(o.merges&&o.merges.length) out.push(`<mergeCells count="${o.merges.length}">`+o.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')+'</mergeCells>');
  out.push('<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>');
  if(o.drawing) out.push('<drawing r:id="rId1"/>');
  out.push('</worksheet>'); return out.join('');
}
// styles: 0 default · 1 grey header (white bold) · 2 bold header · 3 set title · 4 number (0.000) · 5+i group colour header
function stylesXml(groupColors){
  const fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>','<fill><patternFill patternType="solid"><fgColor rgb="FF808080"/><bgColor indexed="64"/></patternFill></fill>']
    .concat(groupColors.map(c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${hexU(pastel(c))}"/><bgColor indexed="64"/></patternFill></fill>`));
  const fonts=['<font><sz val="11"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>','<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>','<font><b/><sz val="11"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>','<font><b/><sz val="14"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>'];
  const C='<alignment horizontal="center" vertical="center" wrapText="1"/>';
  const xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>',
    `<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${C}</xf>`,
    `<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1">${C}</xf>`,
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>',
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>']
    .concat(groupColors.map((c,i)=>`<xf numFmtId="0" fontId="2" fillId="${3+i}" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${C}</xf>`));
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    `<fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills>`+
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    `<cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="표준" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
}
// header rows shared by both data sheets: group band (merged over a run of the same group) + name band
function bands(items,width,rowG,rowN,groupStyle,merges,startCol){
  let i=0; while(i<items.length){ let j=i; while(j+1<items.length&&items[j+1].group===items[i].group) j++;
    const c0=startCol+i*width, c1=startCol+(j+1)*width-1; rowG[c0]={v:items[i].exp||items[i].group,s:groupStyle(items[i].gcolor)}; for(let c=c0+1;c<=c1;c++) rowG[c]={v:'',s:groupStyle(items[i].gcolor)};
    if(c1>c0) merges.push(colL(c0)+(rowG.__r)+':'+colL(c1)+(rowG.__r)); i=j+1; }
  items.forEach((it,k)=>{ const c0=startCol+k*width; rowN[c0]={v:it.name,s:1}; for(let c=c0+1;c<c0+width;c++) rowN[c]={v:'',s:1}; if(width>1) merges.push(colL(c0)+rowN.__r+':'+colL(c0+width-1)+rowN.__r); });
}

function txRun(text,pt,bold){ return `<a:r><a:rPr lang="ko-KR" altLang="en-US" sz="${Math.round(pt*100)}" b="${bold?1:0}"><a:solidFill><a:srgbClr val="000000"/></a:solidFill><a:latin typeface="Arial"/><a:ea typeface="맑은 고딕"/><a:cs typeface="Arial"/></a:rPr><a:t>${xe(text)}</a:t></a:r>`; }
function richTitle(text,pt,bold,rot,pos){ const lay=pos?`<c:layout><c:manualLayout><c:xMode val="edge"/><c:yMode val="edge"/><c:x val="${pos[0].toFixed(4)}"/><c:y val="${pos[1].toFixed(4)}"/></c:manualLayout></c:layout>`:''; return `<c:title><c:tx><c:rich><a:bodyPr${rot?' rot="-5400000" vert="horz"':''}/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="${Math.round(pt*100)}" b="${bold?1:0}"/></a:pPr>${txRun(text,pt,bold)}</a:p></c:rich></c:tx>${lay}<c:overlay val="0"/></c:title>`; }
function txPr(pt,bold){ return `<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="${Math.round(pt*100)}" b="${bold?1:0}"><a:solidFill><a:srgbClr val="000000"/></a:solidFill><a:latin typeface="Arial"/><a:ea typeface="맑은 고딕"/><a:cs typeface="Arial"/></a:defRPr></a:pPr><a:endParaRPr lang="en-US"/></a:p></c:txPr>`; }
const LN=(w,hex,dash)=>`<a:ln w="${Math.round(w)}" cap="rnd"><a:solidFill><a:srgbClr val="${hexU(hex)}"/></a:solidFill>${dash?`<a:prstDash val="${dash}"/>`:''}<a:round/></a:ln>`;

function chartXml(C,refs,hasNote){
  const sp=C.spec, L=LOOK[sp.look], k=sp.fontScale||1, ax=sp.axes;
  const TX=sp.txt||{}; const tsz=(key,def)=>(TX[key]&&+TX[key].sz>0)?+TX[key].sz:def; const toff=(key,d)=>+(TX[key]&&TX[key][d])||0;
  const fmt=st=>{ const d=decimals(st); return d?'0.'+'0'.repeat(d):'0'; };
  const ser=sp.series.map((s,i)=>{ const r=refs[i]; const lw=(s.lineW||2)*EMU;
    const line=s.line===false?'<a:ln><a:noFill/></a:ln>':LN(lw,s.color);
    const mk=(s.marker&&s.marker!=='none')?`<c:marker><c:symbol val="${s.marker}"/><c:size val="7"/><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill>${LN(2*EMU,s.color)}</c:spPr></c:marker>`:'<c:marker><c:symbol val="none"/></c:marker>';
    return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/><c:tx><c:v>${xe(s.name)}</c:v></c:tx><c:spPr>${line}</c:spPr>${mk}<c:xVal><c:numRef><c:f>${xe(r.x)}</c:f></c:numRef></c:xVal><c:yVal><c:numRef><c:f>${xe(r.y)}</c:f></c:numRef></c:yVal><c:smooth val="0"/></c:ser>`; }).join('');
  const axis=(id,cross,pos,a,title,tpt,tb,rot,grid)=>`<c:valAx><c:axId val="${id}"/><c:scaling><c:orientation val="minMax"/><c:max val="${a.max}"/><c:min val="${a.min}"/></c:scaling><c:delete val="0"/><c:axPos val="${pos}"/>`+
    (grid?`<c:majorGridlines><c:spPr><a:ln w="9525"><a:solidFill><a:srgbClr val="BFBFBF"/></a:solidFill><a:prstDash val="sysDash"/></a:ln></c:spPr></c:majorGridlines>`:'')+
    (title?richTitle(title,tpt,tb,rot):'')+`<c:numFmt formatCode="${fmt(a.step)}" sourceLinked="0"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/>`+
    `<c:spPr><a:ln w="9525"><a:solidFill><a:srgbClr val="000000"/></a:solidFill></a:ln></c:spPr>${txPr(tsz('tick',L.tick*k),true)}<c:crossAx val="${cross}"/><c:crosses val="min"/><c:crossBetween val="midCat"/><c:majorUnit val="${a.step}"/></c:valAx>`;
  const lb=C.legendBox; const lpos={top:'t',bottom:'b'}[sp.legend]||'r';
  const legend=(sp.legend==='none'||!lb)?'':`<c:legend><c:legendPos val="${lpos}"/><c:layout><c:manualLayout><c:xMode val="edge"/><c:yMode val="edge"/><c:x val="${lb.x.toFixed(4)}"/><c:y val="${lb.y.toFixed(4)}"/><c:w val="${lb.w.toFixed(4)}"/><c:h val="${lb.h.toFixed(4)}"/></c:manualLayout></c:layout><c:overlay val="1"/>`+
    `<c:spPr><a:solidFill><a:srgbClr val="F2F2F2"/></a:solidFill><a:ln w="9525"><a:solidFill><a:srgbClr val="000000"/></a:solidFill></a:ln><a:effectLst><a:outerShdw blurRad="50800" dist="38100" dir="2700000" algn="tl" rotWithShape="0"><a:prstClr val="black"><a:alpha val="40000"/></a:prstClr></a:outerShdw></a:effectLst></c:spPr>${txPr(lb.sz||L.leg*k,false)}</c:legend>`;
  const P=L.plot;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<c:roundedCorners val="0"/><c:chart>'+(sp.title?richTitle(sp.title,tsz('title',L.title*k),!!L.titleB,false,[Math.max(0,(L.W/2+toff('title','dx')-tw(sp.title,tsz('title',L.title*k)*PT,!!L.titleB)/2-4)/L.W),Math.max(0,0.006+toff('title','dy')/L.H)]):'')+'<c:autoTitleDeleted val="'+(sp.title?0:1)+'"/>'+
    `<c:plotArea><c:layout><c:manualLayout><c:layoutTarget val="inner"/><c:xMode val="edge"/><c:yMode val="edge"/><c:x val="${P[0]}"/><c:y val="${P[1]}"/><c:w val="${P[2]}"/><c:h val="${P[3]}"/></c:manualLayout></c:layout>`+
    `<c:scatterChart><c:scatterStyle val="lineMarker"/><c:varyColors val="0"/>${ser}<c:axId val="501"/><c:axId val="502"/></c:scatterChart>`+
    axis(501,502,'b',ax.x,sp.xTitle,tsz('xt',L.xt*k),!!L.xtB,false,false)+axis(502,501,'l',ax.y,sp.yTitle,tsz('yt',L.yt*k),!!L.ytB,true,true)+
    '<c:spPr><a:gradFill rotWithShape="1"><a:gsLst><a:gs pos="0"><a:srgbClr val="FFFFFF"/></a:gs><a:gs pos="100000"><a:srgbClr val="D9D9D9"/></a:gs></a:gsLst><a:lin ang="5400000" scaled="0"/></a:gradFill><a:ln w="9525"><a:solidFill><a:srgbClr val="000000"/></a:solidFill></a:ln></c:spPr></c:plotArea>'+
    legend+'<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart>'+
    '<c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="9525"><a:solidFill><a:srgbClr val="000000"/></a:solidFill></a:ln></c:spPr>'+
    `<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr><a:latin typeface="Arial"/><a:ea typeface="맑은 고딕"/></a:defRPr></a:pPr><a:endParaRPr lang="en-US"/></a:p></c:txPr>`+
    (hasNote?'<c:userShapes r:id="rId1"/>':'')+'</c:chartSpace>';
}
function noteXml(C){
  const L=LOOK[C.spec.look], k=C.spec.fontScale||1, TX=C.spec.txt||{}; const pt=(TX.note&&+TX.note.sz>0)?+TX.note.sz:L.note*k; const tpx=L.title*k*PT; const top=(C.spec.title?(L.H*.006+tpx*1.32+3)/L.H:C.noteBox.y1)+(+(TX.note&&TX.note.dy)||0)/L.H;
  const nb=Object.assign({},C.noteBox); nb.y1=Math.max(nb.y1,top); nb.y2=L.plot[1]-.004;
  const paras=nb.lines.map(t=>`<a:p><a:pPr algn="l"/>${txRun(t,pt,true)}</a:p>`).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<c:userShapes xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:cdr="http://schemas.openxmlformats.org/drawingml/2006/chartDrawing">'+
    `<cdr:relSizeAnchor><cdr:from><cdr:x>${nb.x1.toFixed(4)}</cdr:x><cdr:y>${Math.max(0,nb.y1).toFixed(4)}</cdr:y></cdr:from><cdr:to><cdr:x>${nb.x2.toFixed(4)}</cdr:x><cdr:y>${Math.max(nb.y1+.02,nb.y2).toFixed(4)}</cdr:y></cdr:to>`+
    '<cdr:sp macro="" textlink=""><cdr:nvSpPr><cdr:cNvPr id="2" name="조건 메모"/><cdr:cNvSpPr txBox="1"/></cdr:nvSpPr><cdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></cdr:spPr>'+
    `<cdr:txBody><a:bodyPr wrap="none" lIns="0" tIns="0" rIns="0" bIns="0" anchor="t"/><a:lstStyle/>${paras}</cdr:txBody></cdr:sp></cdr:relSizeAnchor></c:userShapes>`;
}

function buildXlsx(M){
  if(typeof JSZip==='undefined') throw new Error('nozip');
  const isC=M.kind==='cycle'; const dataName=isC?'Cycle data':'Profile data'; const Q=`'${dataName}'`;
  // group colours → header styles
  const items=isC?M.cells:M.curves; const gcols=[...new Set(items.map(i=>i.gcolor))]; const gStyle=c=>5+gcols.indexOf(c);
  const rows=[], merges=[]; const refOf=new Map();
  if(isC){
    const {H,rows:body}=cycleTable(M); const top=4, last=top+Math.max(1,body.length)-1;
    const rG=[]; rG.__r=1; const rN=[]; rN.__r=2; const rH=[{v:'Cycle',s:1}];
    rG[0]={v:'',s:0}; rN[0]={v:'',s:0};
    bands(M.cells,4,rG,rN,gStyle,merges,1);
    M.cells.forEach((c,i)=>{ H.forEach((h,k)=>{ rH[1+i*4+k]={v:h,s:2}; }); refOf.set(c.cell.name,{x:`${Q}!$A$${top}:$A$${last}`,col:k=>`${Q}!$${colL(1+i*4+(k-1))}$${top}:$${colL(1+i*4+(k-1))}$${last}`}); });
    rows.push(rG,rN,rH); for(const r of body) rows.push(r);
  } else {
    const rG=[]; rG.__r=1; const rN=[]; rN.__r=2; const rL=[]; const rU=[]; const top=5;
    bands(M.curves,2,rG,rN,gStyle,merges,0);
    const cols=M.curves.map(c=>curveRows(c,M.connect)); const n=Math.max(1,...cols.map(c=>c.length));
    M.curves.forEach((c,i)=>{ rL[2*i]={v:c.label,s:2}; rL[2*i+1]={v:'',s:2}; merges.push(colL(2*i)+'3:'+colL(2*i+1)+'3'); rU[2*i]={v:'mAh/g',s:2}; rU[2*i+1]={v:'Volt (V)',s:2};
      const len=Math.max(1,cols[i].length), last=top+len-1; refOf.set(c.key,{x:`${Q}!$${colL(2*i)}$${top}:$${colL(2*i)}$${last}`,y:`${Q}!$${colL(2*i+1)}$${top}:$${colL(2*i+1)}$${last}`}); });
    rows.push(rG,rN,rL,rU);
    for(let r=0;r<n;r++){ const row=[]; cols.forEach((col,i)=>{ const p=col[r]; if(p){ row[2*i]=p[0]; row[2*i+1]=p[1]; } }); rows.push(row); }
  }
  const dataCols=isC?[[1,1,8],[2,1+M.cells.length*4,11]]:[[1,Math.max(1,M.curves.length*2),10]];
  const dataSheet=sheetXml(rows,{merges,cols:dataCols,freeze:isC?3:4,freezeCol:isC?1:0,heights:{1:30}});

  // chart sheet: one row of charts per set, like the app
  const zip=new JSZip(); const anchors=[]; const crow=[]; let y=10, cur=null, x=10, rowH=0; const gap=16;
  const maxW=isC?(LOOK.cycle.W*3+gap*2+20):(LOOK.vp.W*2+gap+20);
  const chartFiles=[];
  M.charts.forEach((C,ci)=>{
    const L=LOOK[C.spec.look];
    if(C.set!==cur){ if(cur!==null) y+=rowH+24; cur=C.set; x=10; rowH=0; const r=Math.floor(y/20); crow[r]=[{v:C.set,s:3}]; y=(r+1)*20+6; }
    else if(x+L.W>maxW){ y+=rowH+gap; x=10; rowH=0; }
    const n=ci+1; const refs=C.spec.series.map(s=>{ if(isC){ const R=refOf.get(s.cell.name); return {x:R.x,y:R.col(s.col)}; } const R=refOf.get(s.curve.cell+'\u0001'+s.curve.label); return {x:R.x,y:R.y}; });
    const hasNote=!!(C.noteBox&&C.noteBox.lines&&C.noteBox.lines.length);
    zip.file(`xl/charts/chart${n}.xml`,chartXml(C,refs,hasNote));
    if(hasNote){ zip.file(`xl/drawings/drawingNote${n}.xml`,noteXml(C)); zip.file(`xl/charts/_rels/chart${n}.xml.rels`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chartUserShapes" Target="../drawings/drawingNote${n}.xml"/></Relationships>`); }
    chartFiles.push({n,hasNote});
    anchors.push(`<xdr:absoluteAnchor><xdr:pos x="${Math.round(x*EMU)}" y="${Math.round(y*EMU)}"/><xdr:ext cx="${L.W*EMU}" cy="${L.H*EMU}"/><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${n+1}" name="Chart ${n}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" r:id="rId${n}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:absoluteAnchor>`);
    x+=L.W+gap; rowH=Math.max(rowH,L.H);
  });
  const totalRows=Math.ceil((y+rowH+40)/20); const hts={}; for(let r=0;r<totalRows;r++) hts[r]=15;
  const chartSheet=sheetXml(crow,{drawing:true,tabSelected:true,cols:[[1,1,30]],heights:hts,rowCount:totalRows});
  const drawing='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+anchors.join('')+'</xdr:wsDr>';
  const R='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
    chartFiles.map(f=>`<Override PartName="/xl/charts/chart${f.n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`+(f.hasNote?`<Override PartName="/xl/drawings/drawingNote${f.n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chartshapes+xml"/>`:'')).join('')+'</Types>');
  zip.file('_rels/.rels',R+'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>');
  const now=new Date().toISOString().replace(/\.\d+Z$/,'Z');
  zip.file('docProps/core.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe(baseName())}</dc:title><dc:creator>셀 데이터 그래프 메이커</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`);
  zip.file('docProps/app.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Microsoft Excel</Application></Properties>');
  zip.file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets><sheet name="Charts" sheetId="1" r:id="rId1"/><sheet name="${dataName}" sheetId="2" r:id="rId2"/></sheets></workbook>`);
  zip.file('xl/_rels/workbook.xml.rels',R+'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.file('xl/styles.xml',stylesXml(gcols));
  zip.file('xl/worksheets/sheet1.xml',chartSheet);
  zip.file('xl/worksheets/sheet2.xml',dataSheet);
  zip.file('xl/worksheets/_rels/sheet1.xml.rels',R+'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>');
  zip.file('xl/drawings/drawing1.xml',drawing);
  zip.file('xl/drawings/_rels/drawing1.xml.rels',R+chartFiles.map(f=>`<Relationship Id="rId${f.n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${f.n}.xml"/>`).join('')+'</Relationships>');
  return zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6},mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function saveXlsx(){
  if(!CHARTS.length){ toast('저장할 그래프가 없습니다.'); return; }
  if(typeof JSZip==='undefined'){ toast('엑셀 저장 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }
  toast('엑셀 파일을 만드는 중… (그래프 '+CHARTS.length+'개)');
  try{ const blob=await buildXlsx(exportModel()); saveBlob(baseName()+' - '+(S.tab==='cyc'?'Cycle performance':'Voltage profile')+'.xlsx',blob,null); }
  catch(e){ console.error(e); toast('엑셀 파일을 만들지 못했습니다.'); }
}
function saveCsv(){
  if(!CHARTS.length){ toast('저장할 데이터가 없습니다.'); return; }
  try{ saveBlob(baseName()+' - '+(S.tab==='cyc'?'Cycle data':'Profile data')+'.csv',buildCsv(exportModel()),null); }
  catch(e){ console.error(e); toast('CSV 파일을 만들지 못했습니다.'); }
}

/* ---------------- modal / toast / help / paste ---------------- */
function modal(html,onMount){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close>닫기</button></div></div>`;
  m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-close]')) m.remove(); }); document.body.appendChild(m); document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){m.remove();document.removeEventListener('keydown',k);} }); if(onMount) onMount(m); return m; }
let toastT=0; function toast(msg,act){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=msg;
  if(act){ const b=document.createElement('button'); b.type='button'; b.className='tact'; b.textContent=act.label; b.onclick=()=>{ t.remove(); act.fn(); }; t.appendChild(b); }
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),act?7000:3200); }
const HELP=`<h2>입력 형식 안내</h2>
<p>지금 쓰시는 엑셀 시트 모양 그대로 읽습니다. 시트 이름은 상관없고, 머리글만 아래처럼 되어 있으면 됩니다.</p>
<p><b>사이클 데이터</b> (Full cell Cycle_Raw 형식)<br>
· 셀마다 4칸: <code>Chg. (mAh/g)</code> · <code>Dis. (mAh/g)</code> · <code>Effi. (%)</code> · <code>Ret. (%)</code><br>
· 그 위 행에 셀 이름 (예: <code>Full cell 3차 구동 #1</code>), 맨 위에 실험 이름 (예: <code>3차 구동 (N/P = 1.1)</code>)<br>
· 왼쪽 열에 사이클 번호 (1, 2, 3 …). 사이클 번호가 없는 Formation 행은 건너뜁니다.<br>
· Effi.·Ret. 칸이 비어 있으면 Dis./Chg.×100, Dis./첫 사이클 Dis.×100 으로 자동 계산합니다.</p>
<p><b>전압 프로파일</b> (Full cell Cycle_profile · VP_Initial 형식)<br>
· 곡선마다 2칸: <code>mAh/g</code> · <code>Volt (V)</code><br>
· 그 위 행에 사이클 이름 (예: <code>1C_10th</code>), 그 위 <code>Lot</code> 행에 셀 이름<br>
· 충전 후 방전 데이터가 같은 칸에 이어져 있어도 용량이 0으로 돌아가는 지점에서 자동으로 나눕니다.</p>
<p><b>여러 시트 비교</b><br>· 같은 종류(사이클 또는 전압 프로파일)의 시트가 2개 이상이면 왼쪽 "데이터 시트"가 체크 목록이 됩니다. 여러 개를 체크하면 한 그래프에 겹쳐 그리고, 색은 "시트별" 또는 "셀 이름별"로 묶을 수 있습니다. 전압 프로파일은 사이클 이름(예: 1C_10th와 1.0C_10th)을 같은 사이클로 맞춰 겹칩니다.</p>
<p><b>충방전기 원본 (.cex · .wrd · TOYO)</b><br>· .cex, WonATech .wrd 파일을 그대로 열면 셀 데이터 변환기와 같은 방식으로 읽어 바로 그래프를 그립니다. 열 때 셀 이름, 질량, Formation 사이클 수를 묻습니다. .wrd는 파일에 적힌 활물질 무게를 질량 칸에 미리 채웁니다.<br>· TOYO는 시험 폴더를 통째로 .zip으로 묶어 넣거나 폴더째 끌어다 놓으세요. 000001, 000002 … 숫자 파일(측정 데이터)이 꼭 있어야 하고, CAPACITY.LOG가 있으면 용량을 그 값에 맞춥니다. 나머지 파일은 자동으로 건너뜁니다.</p>
<p><b>연구실 양식 (셀 데이터 변환기에서 저장한 엑셀)</b><br>· Cycle 시트: 셀마다 <code>Chg.</code> 3칸(mAh/g · mAh/cm2 · mAh) · <code>Dis.</code> 3칸 · <code>Effi.</code> · <code>Ret.</code> — mAh/g에 값이 있으면 mAh/g, 없으면 mAh를 씁니다.<br>· Profile 시트: 사이클마다 Capacity 3칸 · Current · Time · Volt 6칸 묶음을 그대로 읽습니다.</p>
<p><b>색 그룹</b>: 셀 이름 끝의 <code>#1</code>, <code>#2</code> 를 뺀 이름이 같으면 같은 색 그룹이 되고, 엑셀처럼 #1 진하게 → #2 중간 → #3 연하게 그려집니다.</p>`;
function showHelp(){ modal(HELP); }
function showPaste(){
  modal(`<h2>엑셀에서 붙여넣기</h2><p class="hint">엑셀에서 머리글(셀 이름 행, Chg./Dis. 또는 mAh/g·Volt 행)부터 데이터 끝까지 선택해 복사(Ctrl+C)한 뒤 아래 칸에 붙여넣으세요(Ctrl+V).</p><textarea id="pasteBox" placeholder="여기에 붙여넣기"></textarea><div class="row"><button class="btn primary" type="button" id="pasteGo">그래프 만들기</button><span class="hint" id="pasteInfo"></span></div>`,m=>{
    const ta=m.querySelector('#pasteBox'); ta.focus();
    ta.addEventListener('input',()=>{ const n=ta.value.split('\n').length; m.querySelector('#pasteInfo').textContent=n>1?n+'행 붙여넣음':''; });
    m.querySelector('#pasteGo').addEventListener('click',()=>{ if(addPasted(ta.value)) m.remove(); });
  });
}
