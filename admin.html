<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="firebase-config.js"></script>
<script>if(window.CELLGRAPH_FIREBASE===undefined) window.CELLGRAPH_FIREBASE=null;</script>
<script src="login.js"></script>
</head><body>
<title>사용자 승인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f3f5f6; --panel:#ffffff; --ink:#14202a; --ink2:#4a5760; --muted:#7a8790; --line:#d9e0e4;
  --teal:#0f5c78; --copper:#b4602b; --on-teal:#ffffff; --ok:#2e7d32; --bad:#c62828;
  --ui:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11171a; --panel:#182025; --ink:#e3e9ec; --ink2:#b0bec5; --muted:#84939c; --line:#2c373d;
  --teal:#5fb3d3; --copper:#e39363; --on-teal:#0a1a20; --ok:#7bc47f; --bad:#ef8a80; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#11171a; --panel:#182025; --ink:#e3e9ec; --ink2:#b0bec5; --muted:#84939c; --line:#2c373d;
  --teal:#5fb3d3; --copper:#e39363; --on-teal:#0a1a20; --ok:#7bc47f; --bad:#ef8a80; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 32px}
.top{display:flex;align-items:center;gap:12px;padding-block:20px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0}
.top a.back{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.top #acct{margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.who{flex:1;min-width:180px}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-family:var(--mono);font-size:12px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.ok{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:600}
.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:wait}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.msg{padding:28px 0;color:var(--ink2)}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--muted)}
</style>
<div class="wrap">
  <header class="top"><a class="back" href="index.html">← Cell·Data Lab</a><h1>사용자 승인</h1><div id="acct" hidden></div></header>
  <div id="body"><div class="msg">확인 중…</div></div>
  <footer>© 2026 L.J.N. All rights reserved · 무단 복제·수정·배포 금지</footer>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>t?new Date(t).toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
if(!window.FBA||!FBA.MODE){ $('#body').innerHTML='<div class="msg">로그인 기능(login.js)을 찾지 못했습니다.</div>'; return; }
FBA.chip($('#acct'));
let unsubs=[];
function stop(){ unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs=[]; }
FBA.onStatus(st=>{
  stop();
  if(!FBA.CONFIGURED){ $('#body').innerHTML='<div class="msg">아직 로그인 서버가 연결되지 않았습니다. firebase-config.js를 채워 주세요.</div>'; return; }
  if(st==='checking'){ $('#body').innerHTML='<div class="msg">확인 중…</div>'; return; }
  if(st==='out'){ $('#body').innerHTML='<div class="msg">관리자 계정(Google)으로 로그인해 주세요. <button class="btn ok" type="button" data-fba="login">로그인</button></div>'; return; }
  if(!FBA.admin){ $('#body').innerHTML='<div class="msg">이 화면은 관리자만 볼 수 있습니다.</div>'; return; }
  $('#body').innerHTML=`<section class="card"><h2>승인 대기 <span class="n" id="nReq"></span></h2><p class="hint">로그인해서 사용을 요청한 사람입니다. 승인하면 그 사람 화면이 바로 열립니다.</p><div id="req"></div></section>
    <section class="card"><h2>승인된 사람 <span class="n" id="nOk"></span></h2><p class="hint">승인을 취소하면 다음에 앱을 열 때부터 쓸 수 없습니다. 그 사람이 저장한 데이터는 지워지지 않습니다.</p><div id="ok"></div></section>`;
  const fs=FBA.fs;
  const live=(col,fn)=>{ const q=fs.collection(col); if(typeof q.onSnapshot==='function') unsubs.push(q.onSnapshot(fn,e=>console.warn(e))); else q.get().then(fn); };
  live('requests',snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
    $('#nReq').textContent=docs.length+'명';
    $('#req').innerHTML=docs.length?docs.map(d=>`<div class="row"><div class="who"><b>${esc(d.email||'(이메일 없음)')}</b><small>${esc(d.name||'')} ${esc(when(d.at))}</small></div><button class="btn ok" type="button" data-ok="${esc(d.id)}">승인</button><button class="btn bad" type="button" data-no="${esc(d.id)}">거절</button></div>`).join(''):'<div class="empty">기다리는 사람이 없습니다.</div>';
    window.__req=docs;
  });
  live('approved',snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
    $('#nOk').textContent=docs.length+'명';
    $('#ok').innerHTML=docs.length?docs.map(d=>`<div class="row"><div class="who"><b>${esc(d.email||'(이메일 없음)')}</b><small>승인 ${esc(when(d.at))}</small></div><button class="btn bad" type="button" data-rm="${esc(d.id)}">승인 취소</button></div>`).join(''):'<div class="empty">아직 승인한 사람이 없습니다.</div>';
  });
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-ok],[data-no],[data-rm]'); if(!b) return; const fs=FBA.fs; b.disabled=true;
  try{
    if(b.dataset.ok){ const id=b.dataset.ok; const r=(window.__req||[]).find(x=>x.id===id)||{}; await fs.doc('approved/'+id).set({email:r.email||'',name:r.name||'',at:Date.now()}); await fs.doc('requests/'+id).delete(); FBA.toast('승인했습니다.'); }
    else if(b.dataset.no){ if(!confirm('이 요청을 거절할까요? (그 사람이 다시 로그인하면 요청이 다시 들어옵니다)')){ b.disabled=false; return; } await fs.doc('requests/'+b.dataset.no).delete(); FBA.toast('거절했습니다.'); }
    else if(b.dataset.rm){ if(!confirm('승인을 취소할까요?')){ b.disabled=false; return; } await fs.doc('approved/'+b.dataset.rm).delete(); FBA.toast('승인을 취소했습니다.'); }
  }catch(err){ console.warn(err); FBA.toast('처리하지 못했습니다. 보안 규칙의 관리자 이메일을 확인하세요.'); b.disabled=false; }
});
FBA.init();
})();
</script>

</body></html>
